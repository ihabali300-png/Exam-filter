<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دليل تيكتات الدعم 🎫</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#111827;--mute:#6b7280;--line:#e5e7eb;--acc:#111827;--soft:#f3f4f6;--blue:#2563eb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Cairo,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
.wrap{max-width:620px;margin:0 auto;padding:0 14px 60px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0 10px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:10px;min-height:36px}
.bar h1{margin:0;font-size:19px;font-weight:800;flex:1}
.back{border:0;background:var(--card);border:1px solid var(--line);border-radius:10px;height:36px;padding:0 12px;font:inherit;font-weight:700;cursor:pointer}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:16px;padding:13px 44px 13px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);outline:none}
.search input:focus{border-color:var(--ink)}
.search span{position:absolute;right:14px;top:50%;transform:translateY(-50%);opacity:.5}
.clr{position:absolute;left:8px;top:50%;transform:translateY(-50%);border:0;background:var(--soft);border-radius:8px;width:30px;height:30px;cursor:pointer;display:none}
.lbl{font-size:13px;color:var(--mute);font-weight:700;margin:16px 4px 8px}
/* reason tiles */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:right;font:inherit;cursor:pointer;display:flex;gap:10px;align-items:center;color:inherit}
.tile:active{transform:scale(.98)}
.tile .ic{font-size:22px;flex:0 0 auto}
.tile b{font-size:14px;display:block;line-height:1.35}
.tile small{color:var(--mute);font-size:12px}
/* list */
.best{border:2px solid var(--blue)!important}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.it{display:flex;align-items:center;gap:10px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 14px;text-align:right;font:inherit;cursor:pointer;color:inherit}
.it:last-child{border-bottom:0}
.it:active{background:var(--soft)}
.it .tx{flex:1;min-width:0}
.it b{display:block;font-size:15px}
.it small{display:block;color:var(--mute);font-size:13px}
.it .ar{color:var(--mute);font-size:18px}
.crumb{font-size:12px;color:var(--blue);font-weight:700}
.empty{padding:20px;text-align:center;color:var(--mute)}
.note{background:#fff7ed;border:1px solid #fed7aa;color:#7c2d12;border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px}
/* result */
.hero{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.hero h2{margin:0;font-size:17px}
.form{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.f{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.f:last-child{border-bottom:0}
.f .k{font-size:12px;color:var(--mute)}
.f .v{font-weight:700;font-size:15px}
.f .tx{flex:1;min-width:0}
.cb{flex:0 0 auto;border:1px solid var(--line);background:var(--soft);border-radius:10px;height:38px;padding:0 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.cb.ok{background:#dcfce7;border-color:#86efac}
.pill{display:inline-block;border-radius:8px;padding:0 10px;font-size:13px;font-weight:700}
.h{background:#fee2e2;color:#991b1b}.m{background:#fef3c7;color:#92400e}.l{background:#dcfce7;color:#166534}
.sm{font-size:13px;color:var(--mute);font-weight:400}
.box{border-radius:12px;padding:10px 12px;margin-top:10px;font-size:14px;background:var(--card);border:1px solid var(--line)}
textarea{width:100%;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:12px;padding:10px;min-height:150px;direction:rtl;background:#fafafa}
.big{width:100%;margin-top:8px;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:800;font-size:15px;background:var(--acc);color:#fff;cursor:pointer}
.big.ok{background:#16a34a}
</style>
</head>

 {r:"rx",sub:"Check Lens Availability",q:"عدسة شمسية بمقاس / ملونة / بولارايزد",k:"شمسيه بمقاس ملونه بولارايزد polarized صبغه tint",p:"m",so:0,need:"المقاس + اللون + نوع الفريم",tip:"",tpl:"التحقق من توفر عدسة شمسية بمقاس.\nالمقاس: \nاللون/النوع: "},
 {r:"rx",sub:"مشكلات فحص الجودة (QC)",q:"العدسة فيها خدش أو فقاعة أو الطبقة مقشّرة",k:"خدش فقاعه طبقه مقشره كوتنج coating عيب",p:"h",so:1,need:"رقم الطلب + صور",tip:"",tpl:"عيب في العدسة (خدش / طبقة).\nالمرفقات: صور ✅\nالمطلوب: إعادة تصنيع."},
 {r:"rx",sub:"مشكلات فحص الجودة (QC)",q:"المحور (Axis) أو السنتر غلط في النظارة الجاهزة",k:"محور axis سنتر مركز بريزم prism",p:"h",so:1,need:"قراءة اللينسوميتر + الوصفة",tip:"",tpl:"خطأ في (المحور / السنتر).\nالقراءة: R ___ L ___\nالوصفة: R ___ L ___\nالمطلوب: إعادة تصنيع."},
 {r:"rx",sub:"مشكلات PR / PO / الإطار / تركيب العدسات",q:"العدسة مش راكبة صح في الفريم / بتقع",k:"العدسه بتقع مش راكبه فاكه فريم سايب",p:"m",so:1,need:"رقم الطلب + صورة",tip:"",tpl:"العدسة غير مثبتة جيداً في الإطار.\nالمرفقات: صورة ✅\nالمطلوب: "},
 {r:"rx",sub:"مشكلات PR / PO / الإطار / تركيب العدسات",q:"الفريم اتكسر أثناء التركيب في المعمل",k:"الفريم اتكسر اثناء التركيب معمل كسر",p:"h",so:1,need:"رقم الطلب + صور",tip:"",tpl:"الإطار تعرض للكسر أثناء التركيب.\nالمرفقات: صور ✅\nالمطلوب: بديل للإطار."},
 {r:"rx",sub:"مشكلات PR / PO / الإطار / تركيب العدسات",q:"فريم العميل الخاص (جايبه معاه) ومحتاج يتعمل له عدسات",k:"فريم العميل خاص جايبه معاه فريم قديم",p:"l",so:1,need:"رقم الطلب + صورة الفريم + مقاساته",tip:"",tpl:"عدسات لفريم خاص بالعميل.\nمقاسات الفريم: \nالمطلوب: إنشاء الطلب."},
];
const ORDER=["sale","trans","ins","ret","inv","disc","cash","cust","sys","it","otp","rx"];
const SHORT={sale:"إلغاء، شحن، عنوان، حالة الطلب",trans:"تحويل، بوليصة، تعبئة مخزون",ins:"موافقة، مبلغ، شركة التأمين",ret:"استرداد، تابي/تمارا، رصيد المحفظة",inv:"مخزون، سعر، منتج مش لاقيه",disc:"كوبون، خصم، عرض",cash:"شيفت، رصيد، إيداع، موظف",cust:"حساب، OTP، طلب أونلاين",sys:"دخول، النظام واقف",it:"Geidea، نت، طابعة، أجهزة",otp:"العميل واقف ومحتاج يكمل",rx:"وصفة، عدسة، QC، PR/PO"};
const PN={h:["عالية","h","العميل أو البيع واقف"],m:["متوسطة","m","محتاجة حل النهارده"],l:["منخفضة","l","مش مستعجلة"]};
const TY={b:["عائق — لا أستطيع المتابعة","h"],f:["خلل — هناك شيء لا يعمل","m"],q:["سؤال / مساعدة","l"]};
function typeOf(s){
  if(s.ty) return s.ty;
  const t=s.sub||"";
  const broken=/تعذّر|مشكل|غير صحيح|خاطئ|لا يعمل|لا يستلم|مفقود|تأخر|اختلاف|غير متاح|غير ظاهر|not visible|لم يتم|لم تتحول|متوقف/;
  const ask=/^طلب |استفسار|الاستعلام|التحقق|Check|إدارة|تثبيت|تركيب أجهزة|إعادة تعيين|^إلغاء|تغيير عنوان|تحديث رقم|Proof|اتصالاً|Cancel and Enable/;
  if(ask.test(t)&&!broken.test(t)) return "q";
  return s.p==="h"?"b":"f";
}
function subjOf(s){ return (s.sub && s.sub!=="أخرى") ? s.sub : s.q.split(" / ")[0].split(" (")[0]; }
const $=id=>document.getElementById(id);
const norm=x=>x.toLowerCase().replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/[ًٌٍَُِّْـ]/g,"");
const esc=x=>String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
let state={v:"home"};

function cpy(btn,text){
  const ok=()=>{const o=btn.innerHTML;btn.classList.add("ok");btn.innerHTML="✅ اتنسخ";setTimeout(()=>{btn.classList.remove("ok");btn.innerHTML=o;},1300);};
  const fb=()=>{const t=document.createElement("textarea");t.value=text;document.body.appendChild(t);t.select();try{document.execCommand("copy");ok();}catch(e){}t.remove();};
  try{navigator.clipboard.writeText(text).then(ok,fb);}catch(e){fb();}
}
function item(i,showReason){
  const s=S[i],r=R[s.r];
  const oth=s.sub==="أخرى";const title=s.nosub?r.t:(s.sub&&!oth?s.sub:s.q);const small=oth?"السبب الفرعي ‹ أخرى":s.q;
  return `<button class="it" data-i="${i}"><div class="tx">${showReason?`<span class="crumb">${r.e} ${r.t}</span>`:""}<b>${esc(title)} <span class="pill ${PN[s.p][1]}" style="font-size:11px;vertical-align:middle">${PN[s.p][0]}</span></b><small>${esc(small)}</small></div><span class="ar">‹</span></button>`;
}
function bindItems(){document.querySelectorAll(".it[data-i]").forEach(b=>b.onclick=()=>go({v:"res",i:+b.dataset.i}));}

function home(){
  $("view").innerHTML=`<div class="lbl">اختار السبب زي ما هو في شاشة التيكت</div>
  <div class="tiles">${ORDER.map(k=>`<button class="tile" data-k="${k}"><span class="ic">${R[k].e}</span><span><b>${R[k].t}</b><small>${SHORT[k]}</small></span></button>`).join("")}</div>`;
  document.querySelectorAll(".tile").forEach(b=>b.onclick=()=>go({v:"reason",k:b.dataset.k}));
}
function reason(k){
  const idx=S.map((s,i)=>i).filter(i=>S[i].r===k);
  $("view").innerHTML=`<div class="lbl">اختار الموقف اللي قدامك</div><div class="list">${idx.map(i=>item(i,false)).join("")}</div>`;
  bindItems();
}
function search(q){
  const STOP=new Set(["العميل","عميل","عايز","عاوز","ابغي","ابي","مش","في","من","علي","عن","او","و","ده","دي","هو","هي","انا","لو","مع","اللي","بس","كده","عنده","عندي","فيه","يا"]);
  const ws=norm(q).split(/\s+/).filter(w=>w.length>1&&!STOP.has(w));
  let res=S.map((s,i)=>{const head=norm((s.sub||"")+" "+s.q),hay=norm([s.k,R[s.r].t,s.need].join(" "));
    let hit=0,sc=0;ws.forEach(w=>{const core=w.replace(/^(وال|بال|لل|ال)/,"");const st=core.length>3?core.replace(/[هي]$/,""):core;
      if(head.includes(w)){hit++;sc+=3;} else if(hay.includes(w)){hit++;sc+=2;} else if(head.includes(st)||hay.includes(st)){hit++;sc+=1;}});
    return{i,hit,sc};}).filter(o=>o.hit>0);
  const top=Math.max(0,...res.map(o=>o.hit));
  const need=ws.length>=2?Math.max(top-1,Math.ceil(ws.length/2)):1;
  res=res.filter(o=>o.hit>=need).sort((a,b)=>b.hit-a.hit||b.sc-a.sc).slice(0,10);
  let html="";
  if(res.length){
    const best=res[0],bs=S[best.i];
    html+=`<div class="lbl">⭐ الأنسب</div><div class="list best">${item(best.i,true)}</div>`;
    const rest=res.slice(1);
    const alt=rest.find(o=>(S[o.i].r!==bs.r||S[o.i].sub!==bs.sub)&&o.hit>=best.hit-1);
    if(alt) html+=`<div class="lbl">🔁 خيار تاني محتمل</div><div class="list">${item(alt.i,true)}</div>`;
    const others=rest.filter(o=>o!==alt);
    if(others.length) html+=`<div class="lbl">نتايج تانية</div><div class="list">${others.map(o=>item(o.i,true)).join("")}</div>`;
  } else html=`<div class="list"><div class="empty">😕 مفيش حاجة مطابقة</div></div>`;
  $("view").innerHTML=html+`<div class="note">💡 مش لاقي موقفك بالظبط؟ اختار السبب الأقرب ← «أخرى»، واشرح في الوصف. الموضوع والوصف تقدر تعدّلهم قبل النسخ.</div>`;
  bindItems();
}
function altBox(s){
  if(!s.alt) return "";
  const a=s.alt,j=S.findIndex(x=>x.r===a.r&&(a.sub===""?x.nosub:x.sub===a.sub));
  const name=R[a.r].e+" "+R[a.r].t+(a.sub?" ‹ "+a.sub:"");
  return `<button class="it" style="border:1px dashed var(--blue);border-radius:12px;margin-top:10px;background:#eff6ff" ${j>=0?`data-i="${j}"`:""}><div class="tx"><span class="crumb">🔁 خيار تاني: ${esc(a.why)}</span><b style="font-size:14px">${esc(name)}</b></div>${j>=0?'<span class="ar">‹</span>':""}</button>`;
}
function result(i){
  const s=S[i],r=R[s.r],p=PN[s.p],ty=TY[typeOf(s)],subj=subjOf(s);
  const sub=s.nosub?null:(s.sub||null);
  const f=(k,v,c)=>`<div class="f"><div class="tx"><div class="k">${k}</div><div class="v">${v}</div></div>${c?`<button class="cb" data-c="${encodeURIComponent(c)}">📋 نسخ</button>`:""}</div>`;
  $("view").innerHTML=`
  <div class="hero"><span class="crumb">${r.e} ${r.t}</span><h2>${esc(s.q)}</h2></div>
  <div class="lbl">املا الشاشة بالترتيب ده 👇</div>
  <div class="form">
    ${f("السبب",r.t,r.t)}
    ${f("السبب الفرعي",s.nosub?'<span class="sm">مفيش — الخانة مش هتظهر</span>':esc(sub||"اختار الأقرب"),sub)}
    ${f("رقم طلب البيع",s.so?"لازم يكون مكتوب ✅":'<span class="sm">مش ضروري</span>',null)}
    ${s.doc?f("رقم المستند","⚠️ إجباري — اكتبه",null):""}
    ${f("النوع",`<span class="pill ${ty[1]}">${ty[0]}</span>`,null)}
    ${f("الأولوية",`<span class="pill ${p[1]}">${p[0]}</span> <span class="sm">${p[2]}</span>`,null)}
    <div class="f"><div class="tx"><div class="k">الموضوع — تقدر تعدّله</div><input id="sj" value="${esc(subj)}" style="width:100%;font:inherit;font-weight:700;font-size:15px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-top:2px"></div><button class="cb" id="sjc">📋 نسخ</button></div>
  </div>
  <div class="box">📎 <b>جهّز:</b> ${esc(s.need)}${s.tip?`<div style="margin-top:6px">💡 ${esc(s.tip)}</div>`:""}</div>
  ${altBox(s)}
  <div class="lbl">صف المشكلة — املا الفراغات ___ وعدّل براحتك</div>
  <textarea id="tx">${esc(s.tpl)}</textarea>
  <button class="big" id="cp">📋 انسخ الوصف</button>`;
  document.querySelectorAll(".cb").forEach(b=>b.onclick=()=>cpy(b,decodeURIComponent(b.dataset.c)));
  $("cp").onclick=()=>cpy($("cp"),$("tx").value);
  $("sjc").onclick=()=>cpy($("sjc"),$("sj").value);
  bindItems();
}
let hist=[];
function go(st,push=true){ if(push) hist.push(state); state=st; render(); window.scrollTo(0,0); }
function render(){
  const q=$("q").value.trim();
  $("clr").style.display=q?"block":"none";
  if(state.v==="res"){ $("ttl").textContent="✅ التيكت جاهز"; result(state.i); }
  else if(q){ $("ttl").textContent="🔎 نتائج البحث"; search(q); }
  else if(state.v==="reason"){ $("ttl").textContent=R[state.k].e+" "+R[state.k].t; reason(state.k); }
  else { $("ttl").textContent="🎫 دليل تيكتات الدعم"; home(); }
  $("back").style.display=(state.v!=="home"||q)?"block":"none";
}
$("q").oninput=()=>{ if(state.v==="res"){hist.push(state);state={v:"home"};} render(); };
$("clr").onclick=()=>{$("q").value="";render();$("q").focus();};
$("back").onclick=()=>{ if(state.v!=="res" && $("q").value){$("q").value="";render();return;} state=hist.pop()||{v:"home"}; render(); };
render();
</script>
</body>
</html>
